<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexPlay Lightbox Tracing Studio</title>
    <style>
        /* Modern CSS Reset & Variable Tokens */
        :root {
            --bg-base: #0a0a0c;
            --panel-bg: rgba(18, 18, 24, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --accent-danger: #ef4444;
            --accent-danger-hover: #dc2626;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-glow: 0 12px 40px rgba(0, 0, 0, 0.65), 0 0 20px rgba(59, 130, 246, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-base);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: var(--text-main);
        }

        /* App Canvas Frame */
        #app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(24, 24, 35, 0.4) 0%, transparent 80%),
                radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 100% 100%, 24px 24px;
        }

        /* Tracing Image Asset */
        #trace-image {
            position: absolute;
            max-width: 92%;
            max-height: 92%;
            transform: translate(0px, 0px) scale(1);
            transform-origin: center center;
            will-change: transform;
            cursor: grab;
            display: none;
            filter: drop-shadow(0 0 30px rgba(0, 0, 0, 0.8));
        }
        #trace-image:active {
            cursor: grabbing;
        }

        /* Glassmorphic Control Deck */
        #control-panel {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
            box-shadow: var(--shadow-glow);
            border: 1px solid var(--panel-border);
            width: 90%;
            max-width: 360px;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        /* UI Rows & Labels */
        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        /* Custom Modern Range Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-primary);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        /* Premium Buttons layout */
        .btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 16px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary {
            background: var(--accent-primary);
            border: none;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .btn-square {
            width: 42px;
            height: 42px;
            padding: 0;
            font-size: 16px;
        }

        .btn-lock {
            background: var(--accent-danger);
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 14px;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .btn-lock:hover {
            background: var(--accent-danger-hover);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        .zoom-display {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            min-width: 40px;
            text-align: center;
        }

        /* Absolute Safety Lockdown System */
        #lock-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 9998;
            display: none;
            touch-action: none;
        }

        #unlock-trigger {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: none;
            background: rgba(15, 15, 20, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: rgba(255, 255, 255, 0.4);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }
        #unlock-trigger:active {
            background: var(--accent-danger);
            color: white;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            transform: scale(0.95);
        }

        #file-input { display: none; }
    </style>
</head>
<body>

<div id="app-container">
    <img id="trace-image" src="" alt="Tracing Canvas Reference" draggable="false">

    <!-- Config Deck Menu -->
    <div id="control-panel">
        <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">📁 Load Trace Image</button>
        <input type="file" id="file-input" accept="image/*">
        
        <div class="control-group">
            <label for="opacity-slider">Layer Opacity</label>
            <input type="range" id="opacity-slider" min="0.05" max="1" step="0.05" value="1">
        </div>

        <div class="control-group">
            <label>Scale Matrix</label>
            <div class="control-row">
                <button class="btn btn-square" id="btn-zoom-out">▼</button>
                <div class="zoom-display" id="zoom-readout">100%</div>
                <button class="btn btn-square" id="btn-zoom-in">▲</button>
            </div>
        </div>
        
        <button class="btn btn-lock" id="btn-lock">🔒 Deploy Lock Matrix</button>
    </div>

    <!-- Defense Shields -->
    <div id="lock-shield"></div>
    <button id="unlock-trigger">Hold to Unlock</button>
</div>

<script>
    const fileInput = document.getElementById('file-input');
    const img = document.getElementById('trace-image');
    const opacitySlider = document.getElementById('opacity-slider');
    const controlPanel = document.getElementById('control-panel');
    const lockShield = document.getElementById('lock-shield');
    const unlockTrigger = document.getElementById('unlock-trigger');
    const btnLock = document.getElementById('btn-lock');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const zoomReadout = document.getElementById('zoom-readout');

    let scale = 1;
    let pointX = 0;
    let pointY = 0;
    let startX = 0;
    let startY = 0;
    let isPanning = false;

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                img.src = event.target.result;
                img.style.display = 'block';
                scale = 1; pointX = 0; pointY = 0;
                updateTransform();
            }
            reader.readAsDataURL(file);
        }
    });
